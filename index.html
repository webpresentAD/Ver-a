<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veronika · kalkulačka a rozpočet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#190f2e; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.13);
  --txt:#f7f0ff; --mut:#b8a8d8; --peach:#ffb48a; --lilac:#b79bff;
  --inc:#7ee6c4; --exp:#ff8fa8; --r:26px;
  --disp:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  font-family:var(--body);color:var(--txt);min-height:100vh;
  background:
    radial-gradient(60vmax 50vmax at 8% -10%,#5b2a9e66,transparent 60%),
    radial-gradient(50vmax 40vmax at 100% 10%,#ff7a6b40,transparent 60%),
    radial-gradient(60vmax 50vmax at 60% 110%,#2f6bff30,transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding:max(20px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom));
}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:18px 0 26px}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(2.2rem,6vw,4rem);line-height:1;letter-spacing:-.03em}
h1 span{background:linear-gradient(90deg,var(--peach),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.date{color:var(--mut);font-weight:600;text-transform:capitalize}
.grid{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
h2{font-family:var(--disp);font-size:1.25rem;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}
.col{display:grid;gap:22px}
.calc{position:sticky;top:18px}
@media(max-width:860px){.calc{position:static}}

/* kalkulačka */
.screen{background:#0e0720aa;border:1px solid var(--line);border-radius:20px;padding:14px 18px;text-align:right;margin-bottom:14px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.tape{color:var(--mut);font-size:.85rem;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expr{color:var(--mut);font-size:1.05rem;min-height:1.4em;word-break:break-all}
.res{font-family:var(--disp);font-weight:800;font-size:2.6rem;line-height:1.1;letter-spacing:-.02em;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{
  font:700 1.25rem var(--body);color:var(--txt);height:58px;border:1px solid var(--line);border-radius:18px;
  background:rgba(255,255,255,.08);cursor:pointer;transition:transform .08s,background .15s
}
.keys button:hover{background:rgba(255,255,255,.15)}
.keys button:active{transform:scale(.94)}
.keys .op{background:#b79bff30;color:var(--lilac)}
.keys .fn{color:var(--peach)}
.keys .eq{background:linear-gradient(135deg,var(--peach),#ff7f9b);color:#2a0f2e;border:0}
.keys .z{grid-column:span 2}
.use{margin-top:12px;width:100%}

/* tlačítka, formuláře */
.btn{font:700 1rem var(--body);border:0;border-radius:16px;padding:14px 18px;cursor:pointer;color:#2a0f2e;background:linear-gradient(135deg,var(--peach),#ff7f9b);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--txt);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
label{display:grid;gap:6px;font-size:.85rem;color:var(--mut);font-weight:600}
input,select{font:600 1rem var(--body);color:var(--txt);background:#0e0720aa;border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;color-scheme:dark}
input::placeholder{color:#8f7fb3}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0e0720aa;border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{font:700 1rem var(--body);border:0;border-radius:12px;padding:11px;background:none;color:var(--mut);cursor:pointer}
.seg button.on.e{background:var(--exp);color:#2a0f2e}
.seg button.on.i{background:var(--inc);color:#0e2a22}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media(max-width:520px){.form{grid-template-columns:1fr}}

/* přehled */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:520px){.sum{grid-template-columns:1fr}}
.stat{border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(255,255,255,.04)}
.stat small{color:var(--mut);font-weight:600}
.stat b{display:block;font-family:var(--disp);font-size:1.55rem;margin-top:4px;letter-spacing:-.02em}
.stat.i b{color:var(--inc)}.stat.e b{color:var(--exp)}
.stat.big{background:linear-gradient(135deg,#b79bff30,#ffb48a26)}
.bar{height:12px;border-radius:99px;background:#0e0720aa;border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lilac),var(--peach));transition:width .5s}
.bar i.warn{background:linear-gradient(90deg,#ff9e5e,#ff5d7a)}
.row2{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.9rem}
.chart{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center}
@media(max-width:520px){.chart{grid-template-columns:1fr;justify-items:center}}
.legend{display:grid;gap:8px;width:100%}
.legend div{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend span:last-child{margin-left:auto;color:var(--mut)}

/* seznam */
.day{margin:16px 0 6px;color:var(--mut);font-weight:700;font-size:.85rem}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.dot{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:rgba(255,255,255,.08)}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:700}
.tx .t small{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.amt{font-weight:800;font-family:var(--disp);font-size:1.1rem;white-space:nowrap}
.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}
.del{background:none;border:0;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:8px;border-radius:10px}
.del:hover{color:var(--exp);background:rgba(255,255,255,.08)}
.empty{text-align:center;color:var(--mut);padding:28px 10px;border:1px dashed var(--line);border-radius:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);background:#fff;color:#2a0f2e;font-weight:700;padding:13px 20px;border-radius:99px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:9}
.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1 id="hello"></h1>
    </div>
    <label style="min-width:180px">Měsíc
      <input type="month" id="month">
    </label>
  </header>

  <div class="grid">
    <!-- KALKULAČKA -->
    <section class="card calc" aria-label="Kalkulačka">
      <h2>Kalkulačka</h2>
      <div class="screen">
        <div class="tape" id="tape"></div>
        <div class="expr" id="expr"></div>
        <div class="res" id="res">0</div>
      </div>
      <div class="keys" id="keys"></div>
      <button class="btn ghost use" id="use">Použít výsledek v záznamu</button>
    </section>

    <div class="col">
      <!-- PŘEHLED -->
      <section class="card" aria-label="Přehled">
        <h2>Přehled měsíce</h2>
        <div class="sum">
          <div class="stat i"><small>Příjmy</small><b id="sInc">0 Kč</b></div>
          <div class="stat e"><small>Výdaje</small><b id="sExp">0 Kč</b></div>
          <div class="stat big"><small>Zbývá</small><b id="sBal">0 Kč</b></div>
        </div>
        <div style="margin-top:20px">
          <div class="row2">
            <b>Limit výdajů</b>
            <input id="budget" type="number" inputmode="decimal" min="0" placeholder="např. 15000" style="width:150px">
          </div>
          <div class="bar"><i id="barFill" style="width:0"></i></div>
          <div class="mut" id="barTxt">Nastav si limit a uvidíš, kolik ti ještě zbývá.</div>
        </div>
      </section>

      <!-- PŘIDAT -->
      <section class="card" aria-label="Nový záznam">
        <h2>Nový záznam</h2>
        <div class="seg">
          <button class="on e" data-t="e" type="button">Výdaj</button>
          <button data-t="i" class="i" type="button">Příjem</button>
        </div>
        <div class="form">
          <label>Částka (Kč)<input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0"></label>
          <label>Kategorie<select id="cat"></select></label>
          <label>Poznámka<input id="note" type="text" maxlength="60" placeholder="např. kafe s Luckou"></label>
          <label>Datum<input id="when" type="date"></label>
          <button class="btn full" id="add" type="button">Přidat záznam</button>
        </div>
      </section>

      <!-- GRAF -->
      <section class="card" aria-label="Kam jdou peníze">
        <h2>Kam jdou peníze</h2>
        <div id="chart"></div>
      </section>

      <!-- SEZNAM -->
      <section class="card" aria-label="Záznamy">
        <h2>Záznamy</h2>
        <div id="list"></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CAT = {
  e: { "Jídlo":["🍜","#ffb48a"], "Bydlení":["🏠","#b79bff"], "Doprava":["🚋","#6fc3ff"], "Zábava":["🎟️","#ff8fa8"], "Nákupy":["🛍️","#ffd36e"], "Zdraví":["💊","#7ee6c4"], "Ostatní":["✨","#c9b8e8"] },
  i: { "Výplata":["💼","#7ee6c4"], "Přivýdělek":["💻","#6fc3ff"], "Dárek":["🎁","#ffb48a"], "Ostatní":["✨","#c9b8e8"] }
};
const fmt = n => new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK",maximumFractionDigits:2}).format(n);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let tx = store.get("ver_tx", []);
let budget = store.get("ver_budget", 0);
let type = "e";

/* ---------- hlavička ---------- */
const now = new Date();
const h = now.getHours();
$("#hello").innerHTML = (h<10 ? "Dobré ráno" : h<18 ? "Ahoj" : "Dobrý večer") + ",<br><span>Veroniko</span>";
$("#date").textContent = now.toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long"});
const iso = d => d.toISOString().slice(0,10);
const localISO = d => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
$("#when").value = localISO(now);
$("#month").value = localISO(now).slice(0,7);
$("#budget").value = budget || "";

/* ---------- kalkulačka ---------- */
let expr = "", result = "0", tape = "";
const layout = [
  ["C","fn"],["⌫","fn"],["%","op"],["÷","op"],
  ["7"],["8"],["9"],["×","op"],
  ["4"],["5"],["6"],["−","op"],
  ["1"],["2"],["3"],["+","op"],
  ["0","z"],[","],["=","eq"]
];
$("#keys").innerHTML = layout.map(([k,c]) => `<button class="${c||""}" data-k="${k}" aria-label="${k}">${k}</button>`).join("");
const dispNum = s => s.replace(/\./g, ",");
function calcRender(){
  $("#expr").textContent = dispNum(expr).replace(/\*/g,"×");
  $("#res").textContent = dispNum(result);
  $("#tape").textContent = tape;
}
function evaluate(){
  if(!expr) return;
  let s = expr.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
  if(!/^[\d+\-*/.() ]+$/.test(s)) return;
  try{
    let r = Function('"use strict";return (' + s + ')')();
    if(!isFinite(r)){ result = "Nelze počítat"; expr = ""; calcRender(); return; }
    r = parseFloat(r.toPrecision(12));
    tape = dispNum(expr).replace(/\*/g,"×") + " = " + dispNum(String(r));
    result = String(r); expr = String(r);
  }catch(e){ result = "Chyba"; expr = ""; }
  calcRender();
}
function press(k){
  const ops = "+-*/";
  if(result==="Chyba" || result==="Nelze počítat"){ result="0"; }
  if(k==="C"){ expr=""; result="0"; tape=""; }
  else if(k==="⌫"){ expr = expr.slice(0,-1); result = expr ? result : "0"; }
  else if(k==="="){ evaluate(); return; }
  else if(k==="%"){ if(/\d$/.test(expr)) expr += "%"; }
  else if("÷×−+".includes(k)){
    const o = {"÷":"/","×":"*","−":"-","+":"+"}[k];
    if(!expr && o==="-"){ expr="-"; }
    else if(expr){
      if(ops.includes(expr.slice(-1))) expr = expr.slice(0,-1) + o; else expr += o;
    }
  }
  else if(k==="," || k==="."){
    const last = expr.split(/[+\-*/]/).pop();
    if(!last.includes(".")) expr += last==="" ? "0." : ".";
  }
  else { expr += k; }
  // živý náhled výsledku
  try{
    const s = expr.replace(/(\d+(\.\d+)?)%/g,"($1/100)").replace(/[+\-*/.]+$/,"");
    if(s && /^[\d+\-*/.() ]+$/.test(s) && /[+\-*/]/.test(s.replace(/^-/,""))){
      const r = Function('"use strict";return ('+s+')')();
      if(isFinite(r)) result = String(parseFloat(r.toPrecision(12)));
    } else if(s) result = s.replace(/%/g,"");
  }catch(e){}
  calcRender();
}
$("#keys").addEventListener("click", e => { const b = e.target.closest("button"); if(b) press(b.dataset.k); });
document.addEventListener("keydown", e => {
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if(/^[0-9]$/.test(k)) press(k);
  else if(k==="+") press("+"); else if(k==="-") press("−");
  else if(k==="*") press("×"); else if(k==="/"){ e.preventDefault(); press("÷"); }
  else if(k==="," || k===".") press(",");
  else if(k==="%") press("%");
  else if(k==="Enter" || k==="="){ e.preventDefault(); press("="); }
  else if(k==="Backspace") press("⌫");
  else if(k==="Escape") press("C");
});
$("#use").onclick = () => {
  const v = parseFloat(result);
  if(!isFinite(v)) return toast("Nejdřív něco spočítej");
  $("#amount").value = Math.abs(v);
  $("#amount").scrollIntoView({behavior:"smooth",block:"center"});
  $("#amount").focus();
};

/* ---------- záznamy ---------- */
function fillCats(){
  $("#cat").innerHTML = Object.keys(CAT[type]).map(c => `<option>${c}</option>`).join("");
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  type = b.dataset.t;
  document.querySelectorAll(".seg button").forEach(x => x.className = x===b ? "on " + type : x.dataset.t);
  fillCats();
});
fillCats();
$("#add").onclick = () => {
  const a = parseFloat($("#amount").value);
  if(!(a > 0)) return toast("Zadej částku větší než 0");
  const d = $("#when").value || localISO(new Date());
  tx.push({ id: Date.now(), type, amount: a, cat: $("#cat").value, note: $("#note").value.trim(), date: d });
  store.set("ver_tx", tx);
  $("#amount").value = ""; $("#note").value = "";
  $("#month").value = d.slice(0,7);
  toast(type==="e" ? "Výdaj přidán" : "Příjem přidán");
  render();
};
$("#list").addEventListener("click", e => {
  const b = e.target.closest(".del"); if(!b) return;
  tx = tx.filter(t => t.id !== +b.dataset.id);
  store.set("ver_tx", tx); toast("Záznam smazán"); render();
});
$("#budget").oninput = e => { budget = parseFloat(e.target.value) || 0; store.set("ver_budget", budget); render(); };
$("#month").onchange = render;

function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800);
}

function render(){
  const m = $("#month").value || localISO(now).slice(0,7);
  const rows = tx.filter(t => t.date.startsWith(m)).sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  const inc = rows.filter(t => t.type==="i").reduce((s,t) => s+t.amount, 0);
  const exp = rows.filter(t => t.type==="e").reduce((s,t) => s+t.amount, 0);
  $("#sInc").textContent = fmt(inc);
  $("#sExp").textContent = fmt(exp);
  $("#sBal").textContent = fmt(inc-exp);

  // limit
  const fill = $("#barFill");
  if(budget > 0){
    const p = exp / budget * 100;
    fill.style.width = Math.min(p,100) + "%";
    fill.className = p > 90 ? "warn" : "";
    $("#barTxt").textContent = exp <= budget
      ? `Utraceno ${Math.round(p)} % limitu, zbývá ${fmt(budget-exp)}.`
      : `Limit překročen o ${fmt(exp-budget)}.`;
  } else { fill.style.width = "0"; $("#barTxt").textContent = "Nastav si limit a uvidíš, kolik ti ještě zbývá."; }

  // graf
  const by = {};
  rows.filter(t => t.type==="e").forEach(t => by[t.cat] = (by[t.cat]||0) + t.amount);
  const ent = Object.entries(by).sort((a,b) => b[1]-a[1]);
  if(!ent.length){
    $("#chart").innerHTML = `<div class="empty">Zatím žádné výdaje v tomto měsíci.</div>`;
  } else {
    let acc = 0;
    const arcs = ent.map(([c,v]) => {
      const p = v/exp*100, col = (CAT.e[c]||CAT.e["Ostatní"])[1];
      const s = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${col}" stroke-width="5.5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}"/>`;
      acc += p; return s;
    }).join("");
    $("#chart").innerHTML = `<div class="chart">
      <svg viewBox="0 0 42 42" width="170" height="170" role="img" aria-label="Výdaje podle kategorií">
        <circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5.5"/>${arcs}
        <text x="21" y="20.5" text-anchor="middle" fill="#b8a8d8" font-size="3" font-family="sans-serif">celkem</text>
        <text x="21" y="25" text-anchor="middle" fill="#f7f0ff" font-size="4" font-weight="800" font-family="sans-serif">${Math.round(exp).toLocaleString("cs-CZ")}</text>
      </svg>
      <div class="legend">${ent.map(([c,v]) => `<div><i style="background:${(CAT.e[c]||CAT.e["Ostatní"])[1]}"></i><span>${(CAT.e[c]||CAT.e["Ostatní"])[0]} ${c}</span><span>${fmt(v)} · ${Math.round(v/exp*100)} %</span></div>`).join("")}</div>
    </div>`;
  }

  // seznam
  if(!rows.length){
    $("#list").innerHTML = `<div class="empty">Tady je zatím prázdno. Přidej první výdaj nebo příjem a objeví se tady.</div>`;
  } else {
    let out = "", lastD = "";
    rows.forEach(t => {
      if(t.date !== lastD){
        lastD = t.date;
        out += `<div class="day">${new Date(t.date+"T12:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long"})}</div>`;
      }
      const ic = (CAT[t.type][t.cat]||["✨"])[0];
      out += `<div class="tx"><div class="dot">${ic}</div>
        <div class="t"><b>${esc(t.cat)}</b><small>${esc(t.note) || "&nbsp;"}</small></div>
        <div class="amt ${t.type}">${t.type==="e" ? "−" : "+"}${fmt(t.amount)}</div>
        <button class="del" data-id="${t.id}" aria-label="Smazat záznam">✕</button></div>`;
    });
    $("#list").innerHTML = out;
  }
}
calcRender();
render();
</script>
</body>
</html>
