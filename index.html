<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veronika Finance</title>
<meta name="theme-color" content="#ffd9c7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3d6;--bg2:#ffd0df;--card:#ffffffcc;--ink:#3b1a2e;--mut:#8f6b80;--line:#3b1a2e14;--rose:#ee5b84;--peach:#ff9f7a;--ok:#2f9e7c;--bad:#d6406a;--field:#fff;--nav:#fffffff0;
--disp:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Manrope","Segoe UI",system-ui,sans-serif}
[data-theme=dark]{--bg1:#2a1423;--bg2:#1c0f1e;--card:#ffffff12;--ink:#fff0f4;--mut:#c4a1b3;--line:#ffffff1c;--field:#ffffff0d;--nav:#2a1423f2;--ok:#6fe0bb;--bad:#ff8fab}
*{box-sizing:border-box;margin:0}
html{background:var(--bg2)}
body{font-family:var(--body);color:var(--ink);min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;-webkit-tap-highlight-color:transparent}
#app{max-width:1000px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 120px}
@media(min-width:900px){#app{padding-left:230px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 10px 30px #ee5b8416;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stack{display:grid;gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two.s{grid-template-columns:1fr}}
h1{font:800 clamp(1.9rem,6vw,2.8rem)/1.05 var(--disp);letter-spacing:-.03em}
h2{font:800 1.2rem var(--disp);margin-bottom:12px}h3{font:800 1.3rem var(--disp);margin-bottom:14px}
small,.mut{color:var(--mut);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 0 18px}
.hero{background:linear-gradient(135deg,var(--peach),var(--rose));color:#fff;border:0}
.hero small{color:#fff9}.hero .big{font:800 clamp(2.4rem,11vw,3.6rem)/1.05 var(--disp);letter-spacing:-.03em;margin:6px 0 14px;word-break:break-word}
.hero .two div{background:#ffffff26;border-radius:18px;padding:12px}.hero b{display:block;font:800 1.2rem var(--disp)}
.stat b{display:block;font:800 1.4rem var(--disp);margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--rose));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar i.w{background:linear-gradient(90deg,#ff8a4c,#d6203f)}
.btn{font:700 1rem var(--body);border:0;border-radius:18px;padding:14px 18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--peach),var(--rose));transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.gh{background:var(--field);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:9px 14px;font-size:.9rem;border-radius:14px}
.btn.dg{background:var(--bad)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
label{display:grid;gap:6px;font-size:.82rem;color:var(--mut);font-weight:700}
input,select,textarea{font:600 1rem var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:16px;padding:4px}
.seg button{font:700 1rem var(--body);border:0;border-radius:12px;padding:11px;background:none;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0002}.seg button.on.e{color:var(--bad)}.seg button.on.i{color:var(--ok)}
[data-theme=dark] .seg button.on{background:#ffffff26;color:#fff}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.tx:first-of-type{border-top:0}
.ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,#ffd9c7,#ffc2d4);flex:none}
.tx .t{flex:1;min-width:0}.tx .t b,.tx .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:800 1.05rem var(--disp);white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:24px 10px;border:1.5px dashed var(--line);border-radius:20px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap}
.chips .on{background:var(--ink);color:var(--bg1);border-color:transparent}
.day{margin:12px 0 2px;color:var(--mut);font-weight:700;font-size:.82rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.72rem;color:var(--mut);font-weight:700}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--field);font:700 .85rem var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal button.out{opacity:.3}.cal button.sel{outline:2px solid var(--rose)}.cal button.pd{background:linear-gradient(135deg,var(--peach),var(--rose));color:#fff}
.dots{display:flex;gap:2px;height:6px}.dots i{width:5px;height:5px;border-radius:50%}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .p{display:flex;align-items:flex-end;gap:2px;width:100%;flex:1}.bars .p i{flex:1;border-radius:6px 6px 2px 2px;min-height:2px}
.bars span{font-size:.68rem;color:var(--mut);font-weight:700}
.legend div{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:600;font-size:.92rem}.legend i{width:12px;height:12px;border-radius:4px}.legend em{margin-left:auto;font-style:normal;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(16px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:700 .68rem var(--body);display:grid;gap:2px;justify-items:center;padding:6px;cursor:pointer;border-radius:14px}
nav button span{font-size:1.35rem}nav button.on{color:var(--rose)}
@media(min-width:900px){nav{left:0;right:auto;top:0;width:200px;flex-direction:column;justify-content:flex-start;gap:6px;padding:30px 12px;border-top:0;border-right:1px solid var(--line)}nav button{flex:none;grid-auto-flow:column;justify-content:start;gap:12px;font-size:.95rem}}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:21;border-radius:99px;padding:16px 22px;box-shadow:0 10px 26px #ee5b8466}
@media(min-width:900px){.fab{bottom:28px;right:28px}}
.ov{position:fixed;inset:0;background:#2a14238c;display:none;align-items:flex-end;justify-content:center;z-index:40}.ov.on{display:flex}
.sheet{background:var(--bg1);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1);display:grid;gap:12px}
[data-theme=dark] .sheet{background:#2a1423}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:30px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-100px);background:var(--ink);color:var(--bg1);font-weight:700;padding:12px 20px;border-radius:99px;transition:transform .35s;z-index:99;max-width:90vw}.toast.on{transform:translate(-50%,0)}
.ob{min-height:100vh;display:grid;align-content:center;gap:16px;max-width:460px;margin:0 auto;padding:24px 4px}
.dots2{display:flex;gap:6px}.dots2 i{height:6px;flex:1;border-radius:9px;background:var(--line)}.dots2 i.on{background:var(--rose)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
/* ========= pomocné ========= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK",maximumFractionDigits:2,minimumFractionDigits:0}).format(n||0);
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const P=s=>new Date(s+"T12:00");
const today=()=>iso(new Date());
const dl=(s,o={weekday:"long",day:"numeric",month:"long"})=>P(s).toLocaleDateString("cs-CZ",o);
const r2=n=>Math.round(n*100)/100;
const DEF={e:["Potraviny","Káva","Restaurace","Doprava","Palivo","Bydlení","Účty","Nákupy","Zdraví","Zábava","Krása","Cestování","Předplatné","Ostatní"],i:["Výplata","Přivýdělek","Dárek","Ostatní"]};
const ICO={Potraviny:"🛒",Káva:"☕",Restaurace:"🍽️",Doprava:"🚋",Palivo:"⛽",Bydlení:"🏠",Účty:"🧾",Nákupy:"🛍️",Zdraví:"💊",Zábava:"🎟️",Krása:"💅",Cestování:"✈️",Předplatné:"🔁",Ostatní:"✨",Výplata:"💼",Přivýdělek:"💻",Dárek:"🎁"};
const COL=["#ee5b84","#ff9f7a","#b58cff","#5fb3ff","#3ecf9e","#ffd166","#ff7eb6","#9aa5ff","#7ed6c4","#c9a0dc"];
const icon=c=>ICO[c]||"🏷️";
const cats=t=>DEF[t].concat(S.cats[t]);

/* ========= stav a ukládání (IndexedDB) ========= */
let S=null,view="home",selDay=null,pOff=0,range="month",flt={q:"",type:"",cat:"",month:""},obStep=0,ob={};
const fresh=()=>({v:1,set:{name:"",payday:1,budget:0,income:0,rem:"",remOn:false,theme:"light",done:false,lastRem:""},cats:{e:[],i:[]},limits:{},tx:[],goals:[],rec:[]});
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("veronika-finance",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){
  try{const d=await idb();const v=await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>res(q.result);q.onerror=()=>res()});if(v)return v}catch(e){}
  try{const v=localStorage.getItem("vf_state");if(v)return JSON.parse(v)}catch(e){}
  return null;
}
let saveFail=false;
async function save(){
  try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(S,"state");t.oncomplete=res;t.onerror=()=>rej(t.error)})}
  catch(e){try{localStorage.setItem("vf_state",JSON.stringify(S))}catch(e2){if(!saveFail){saveFail=true;toast("Data se nepodařilo uložit. Stáhni si zálohu v Nastavení.")}}}
}
function migrate(){ // převod záznamů ze staré kalkulačky
  try{const old=JSON.parse(localStorage.getItem("ver_tx")||"[]");if(!old.length)return;
    old.forEach(o=>{if(!(o.amount>0)||!o.date)return;if(!cats(o.type).includes(o.cat))S.cats[o.type].push(o.cat);
      S.tx.push({id:uid(),type:o.type,amount:o.amount,cat:o.cat,desc:o.note||"",notes:"",date:o.date})});
    const b=parseFloat(localStorage.getItem("ver_budget"));if(b>0)S.set.budget=b;
    localStorage.removeItem("ver_tx");localStorage.removeItem("ver_budget")}catch(e){}
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ========= období podle výplaty ========= */
function period(off=0){
  const p=Math.min(28,Math.max(1,+S.set.payday||1)),t=new Date();
  const b=new Date(t.getFullYear(),t.getMonth()-(t.getDate()<p?1:0)+off,p);
  const e=new Date(b.getFullYear(),b.getMonth()+1,p-1);
  return{s:iso(b),e:iso(e)};
}
const inR=(t,r)=>t.date>=r.s&&t.date<=r.e;
const sum=(l,ty)=>r2(l.filter(t=>t.type===ty).reduce((a,t)=>a+t.amount,0));
const saved=()=>r2(S.goals.reduce((a,g)=>a+g.saved,0));
const balance=()=>r2(sum(S.tx,"i")-sum(S.tx,"e")-saved());
function advance(s,f){
  const d=P(s);let n;
  if(f==="week")n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);
  else if(f==="year")n=new Date(d.getFullYear()+1,d.getMonth(),Math.min(d.getDate(),new Date(d.getFullYear()+1,d.getMonth()+1,0).getDate()));
  else{const l=new Date(d.getFullYear(),d.getMonth()+2,0).getDate();n=new Date(d.getFullYear(),d.getMonth()+1,Math.min(d.getDate(),l))}
  return iso(n);
}
const FREQ={week:"týdně",month:"měsíčně",year:"ročně"};

/* ========= UI základ ========= */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
function sheet(title,body,ok,okTxt="Uložit",extra){
  const o=$("#ov");o.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}<div class="acts"><button class="btn gh" data-x>Zrušit</button><button class="btn" data-ok>${okTxt}</button></div></div>`;
  o.classList.add("on");const c=()=>o.classList.remove("on");
  o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)c()};
  $("[data-ok]",o).onclick=()=>{if(ok(o)!==false)c()};
  extra&&extra(o);const f=$("input,select",o);f&&!("ontouchstart" in window)&&f.focus();
}
const field=(id,l,ty="text",v="",x="")=>`<label>${l}<input id="${id}" type="${ty}" value="${esc(v)}" ${x}></label>`;
const sel=(id,l,opts,v)=>`<label>${l}<select id="${id}">${opts.map(([k,n])=>`<option value="${esc(k)}" ${k==v?"selected":""}>${esc(n)}</option>`).join("")}</select></label>`;
const num=(id)=>{const v=parseFloat(String($("#"+id).value).replace(",","."));return isFinite(v)?v:NaN};
const okAmt=v=>v>0&&v<=1e9;

/* ========= přidat / upravit transakci ========= */
function txSheet(t){
  const isNew=!t;t=t||{type:"e",date:today(),cat:"Potraviny"};let ty=t.type;
  const opts=()=>cats(ty).map(c=>`<option ${c===t.cat?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new">+ Nová kategorie…</option>`;
  const body=`<div class="seg" id="sg"><button type="button" class="${ty==="e"?"on e":""}" data-t="e">Výdaj</button><button type="button" class="${ty==="i"?"on i":""}" data-t="i">Příjem</button></div>
  ${field("fa","Částka (Kč)","number",t.amount||"",'inputmode="decimal" step="0.01" min="0" placeholder="0"')}
  <label>Kategorie<select id="fc">${opts()}</select></label>
  ${field("fd","Popis","text",t.desc||"",'maxlength="60" placeholder="např. kafe s Luckou"')}
  ${field("fdt","Datum","date",t.date)}
  <label>Poznámka<textarea id="fn" rows="2" maxlength="300">${esc(t.notes||"")}</textarea></label>
  ${isNew?"":`<button class="btn dg sm" id="fdel">Smazat záznam</button>`}`;
  sheet(isNew?"Nový záznam":"Upravit záznam",body,()=>{
    const a=num("fa");if(!okAmt(a)){toast("Zadej částku větší než 0");return false}
    const d=$("#fdt").value;if(!d){toast("Vyber datum");return false}
    const o={id:t.id||uid(),type:ty,amount:r2(a),cat:$("#fc").value,desc:$("#fd").value.trim(),notes:$("#fn").value.trim(),date:d};
    if(isNew)S.tx.push(o);else S.tx[S.tx.findIndex(x=>x.id===t.id)]=o;
    save();render();toast(isNew?(ty==="e"?"Výdaj uložen":"Příjem uložen"):"Změny uloženy");
  },"Uložit",o=>{
    $("#sg",o).onclick=e=>{const b=e.target.closest("button");if(!b)return;ty=b.dataset.t;t.cat=cats(ty)[0];
      o.querySelectorAll("#sg button").forEach(x=>x.className=x===b?"on "+ty:"");$("#fc",o).innerHTML=opts()};
    $("#fc",o).onchange=e=>{if(e.target.value!=="__new")return;const n=(prompt("Název nové kategorie")||"").trim().slice(0,24);
      if(n&&!cats(ty).includes(n)){S.cats[ty].push(n);t.cat=n;save()}e.target.innerHTML=opts();e.target.value=t.cat};
    const d=$("#fdel",o);if(d)d.onclick=()=>{if(confirm("Opravdu smazat tento záznam?")){S.tx=S.tx.filter(x=>x.id!==t.id);save();o.classList.remove("on");render();toast("Záznam smazán")}};
  });
}

/* ========= pohledy ========= */
const txRow=t=>`<div class="tx" data-edit="${t.id}"><div class="ic">${icon(t.cat)}</div><div class="t"><b>${esc(t.desc||t.cat)}</b><small>${esc(t.cat)} · ${dl(t.date,{day:"numeric",month:"numeric"})}</small></div><div class="amt ${t.type==="e"?"neg":"pos"}">${t.type==="e"?"−":"+"}${fmt(t.amount)}</div></div>`;
function upcoming(to){ // plánované platby do data
  const out=[];S.rec.forEach(r=>{let d=r.next,n=0;while(d<=to&&n++<60){out.push({r,date:d});d=advance(d,r.freq)}});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function home(){
  const pr=period(0),rows=S.tx.filter(t=>inR(t,pr)),inc=sum(rows,"i"),ex=sum(rows,"e"),lim=+S.set.budget||0;
  const up=S.rec.map(r=>({r,date:r.next})).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  const last=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5);
  const h=new Date().getHours(),pc=lim?ex/lim*100:0;
  return`<div class="top"><div><small>${dl(today())}</small><h1>${h<10?"Dobré ráno":h<18?"Ahoj":"Dobrý večer"}${S.set.name?`,<br>${esc(S.set.name)}`:""}</h1></div></div>
  <div class="stack">
  <div class="card hero"><small>Dostupný zůstatek</small><div class="big">${fmt(balance())}</div>
   <div class="two"><div><small>Příjmy v období</small><b>${fmt(inc)}</b></div><div><small>Výdaje v období</small><b>${fmt(ex)}</b></div></div></div>
  <div class="card"><div class="row"><h2 style="margin:0">Rozpočet období</h2><small>${dl(pr.s,{day:"numeric",month:"numeric"})} – ${dl(pr.e,{day:"numeric",month:"numeric"})}</small></div>
   ${lim?`<div class="bar"><i class="${pc>90?"w":""}" style="width:${Math.min(pc,100)}%"></i></div><div class="row"><span>${ex<=lim?`Zbývá <b>${fmt(lim-ex)}</b>`:`<b class="neg">Překročeno o ${fmt(ex-lim)}</b>`}</span><small>${Math.round(pc)} % limitu</small></div>`:`<p class="mut" style="margin:10px 0">Nastav si limit výdajů a uvidíš, kolik ti ještě zbývá.</p><button class="btn sm gh" data-go="budget">Nastavit limit</button>`}</div>
  <div class="two s"><div class="card stat"><small>Našetřeno</small><b>${fmt(saved())}</b></div><div class="card stat"><small>Zbývá z příjmů období</small><b class="${inc-ex<0?"neg":""}">${fmt(inc-ex)}</b></div></div>
  <div class="card"><h2>Nadcházející platby</h2>${up.length?up.map(u=>`<div class="tx" data-go="rec"><div class="ic">${icon(u.r.cat)}</div><div class="t"><b>${esc(u.r.name)}</b><small>${dl(u.date,{day:"numeric",month:"long"})}${u.date<today()?" · po splatnosti":""}</small></div><div class="amt">${fmt(u.r.amount)}</div></div>`).join(""):`<div class="empty">Žádné pravidelné platby. Přidej je v sekci Rozpočet.</div>`}</div>
  <div class="card"><div class="row"><h2 style="margin:0">Poslední záznamy</h2><button class="btn sm gh" data-go="tx">Vše</button></div>${last.length?last.map(txRow).join(""):`<div class="empty" style="margin-top:12px">Zatím tu nic není. Klepni na „+ Přidat“ a zapiš první výdaj nebo příjem.</div>`}</div></div>`;
}
function txView(){
  const q=flt.q.toLowerCase();
  const rows=S.tx.filter(t=>(!flt.type||t.type===flt.type)&&(!flt.cat||t.cat===flt.cat)&&(!flt.month||t.date.startsWith(flt.month))&&(!q||(t.desc+" "+t.cat+" "+t.notes).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  let out="",ld="";rows.forEach(t=>{if(t.date!==ld){ld=t.date;out+=`<div class="day">${dl(t.date)}</div>`}out+=txRow(t)});
  const all=[...new Set(DEF.e.concat(DEF.i,S.cats.e,S.cats.i))];
  return`<div class="top"><h1>Záznamy</h1><button class="btn sm gh" id="csv">Export CSV</button></div><div class="stack">
  <div class="card stack"><input id="fq" type="search" placeholder="Hledat v popisu, kategorii, poznámce…" value="${esc(flt.q)}">
   <div class="two s"><select id="ft"><option value="">Příjmy i výdaje</option><option value="e" ${flt.type==="e"?"selected":""}>Jen výdaje</option><option value="i" ${flt.type==="i"?"selected":""}>Jen příjmy</option></select>
   <select id="fcat"><option value="">Všechny kategorie</option>${all.map(c=>`<option ${c===flt.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
   <label>Měsíc<input id="fm" type="month" value="${flt.month}"></label>
   <div class="row"><small>${rows.length} záznamů · příjmy ${fmt(sum(rows,"i"))} · výdaje ${fmt(sum(rows,"e"))}</small><button class="btn sm gh" id="fclr">Zrušit filtry</button></div></div>
  <div class="card">${rows.length?out:`<div class="empty">${S.tx.length?"Nic neodpovídá filtrům.":"Zatím žádné záznamy."}</div>`}</div></div>`;
}
function budgetView(){
  const pr=period(pOff),rows=S.tx.filter(t=>inR(t,pr)),inc=sum(rows,"i"),ex=sum(rows,"e"),lim=+S.set.budget||0,pc=lim?ex/lim*100:0;
  const by={};rows.filter(t=>t.type==="e").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const lims=Object.entries(S.limits).filter(([,v])=>v>0);
  // kalendář
  const s=P(pr.s),e=P(pr.e),lead=(s.getDay()+6)%7,cells=[];
  const start=new Date(s.getFullYear(),s.getMonth(),s.getDate()-lead);
  const total=Math.ceil((lead+Math.round((e-s)/864e5)+1)/7)*7;
  const bills=upcoming(iso(new Date(start.getTime()+total*864e5)));
  for(let i=0;i<total;i++){const d=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i)),inP=d>=pr.s&&d<=pr.e;
    const ev=S.tx.filter(t=>t.date===d),bl=bills.filter(b=>b.date===d);
    cells.push(`<button class="${inP?"":"out"} ${d===pr.s?"pd":""} ${d===selDay?"sel":""}" data-day="${d}">${+d.slice(8)}<span class="dots">${ev.some(t=>t.type==="i")?'<i style="background:#2f9e7c"></i>':""}${ev.some(t=>t.type==="e")?'<i style="background:#d6406a"></i>':""}${bl.length?'<i style="background:#b58cff"></i>':""}</span></button>`)}
  const sd=selDay||today(),dEv=S.tx.filter(t=>t.date===sd),dB=bills.filter(b=>b.date===sd);
  return`<div class="top"><h1>Rozpočet</h1></div><div class="stack">
  <div class="card"><div class="row"><button class="btn sm gh" data-po="-1" aria-label="Předchozí období">‹</button><div style="text-align:center"><b>${dl(pr.s,{day:"numeric",month:"long"})} – ${dl(pr.e,{day:"numeric",month:"long"})}</b><br><small>${pOff===0?"Aktuální období":"Výplata "+S.set.payday+". dne"}</small></div><button class="btn sm gh" data-po="1" aria-label="Další období">›</button></div>
   <div class="two" style="margin:16px 0"><div class="stat"><small>Příjmy</small><b class="pos">${fmt(inc)}</b></div><div class="stat"><small>Výdaje</small><b class="neg">${fmt(ex)}</b></div><div class="stat"><small>Zbývá</small><b>${fmt(inc-ex)}</b></div><div class="stat"><small>Využití limitu</small><b>${lim?Math.round(pc)+" %":"–"}</b></div></div>
   ${lim?`<div class="bar"><i class="${pc>90?"w":""}" style="width:${Math.min(pc,100)}%"></i></div><small>${ex<=lim?`Zbývá ${fmt(lim-ex)} z limitu ${fmt(lim)}`:`Limit ${fmt(lim)} překročen o ${fmt(ex-lim)}`}</small>`:""}
   <div class="row" style="margin-top:14px"><button class="btn sm" id="setlim">Limit výdajů</button><button class="btn sm gh" id="catlim">Limit kategorie</button></div></div>
  ${lims.length?`<div class="card"><h2>Limity kategorií</h2>${lims.map(([c,v])=>{const u=by[c]||0,p=u/v*100;return`<div style="margin-bottom:12px"><div class="row"><b>${icon(c)} ${esc(c)}</b><small>${fmt(u)} / ${fmt(v)}</small></div><div class="bar"><i class="${p>90?"w":""}" style="width:${Math.min(p,100)}%"></i></div></div>`}).join("")}</div>`:""}
  <div class="card"><h2>Kalendář období</h2><div class="cal">${"PÚSČPSN".split("").map(x=>`<div class="h">${x}</div>`).join("")}${cells.join("")}</div>
   <p class="mut" style="margin:10px 0 0;font-size:.8rem">Barevný den = výplata · zelená tečka příjem · růžová výdaj · fialová platba</p>
   <div class="day">${dl(sd)}${sd===pr.s?" · výplata":""}</div>${dEv.map(txRow).join("")}${dB.map(b=>`<div class="tx"><div class="ic">${icon(b.r.cat)}</div><div class="t"><b>${esc(b.r.name)}</b><small>Plánovaná platba</small></div><div class="amt">${fmt(b.r.amount)}</div></div>`).join("")}${dEv.length||dB.length?"":`<div class="empty">Tento den nic není.</div>`}</div>
  <div class="card" id="rec"><div class="row"><h2 style="margin:0">Pravidelné platby</h2><button class="btn sm" id="addrec">+ Přidat</button></div>
   ${S.rec.length?S.rec.slice().sort((a,b)=>a.next.localeCompare(b.next)).map(r=>`<div class="tx" style="cursor:default"><div class="ic">${icon(r.cat)}</div><div class="t"><b>${esc(r.name)}</b><small>${FREQ[r.freq]} · další ${dl(r.next,{day:"numeric",month:"numeric",year:"numeric"})}</small></div><div class="amt">${fmt(r.amount)}</div></div>
   <div class="row" style="margin:-4px 0 8px 56px"><button class="btn sm" data-rpay="${r.id}">Zaplaceno</button><button class="btn sm gh" data-rskip="${r.id}">Přeskočit</button><button class="btn sm gh" data-redit="${r.id}">Upravit</button></div>`).join(""):`<div class="empty" style="margin-top:12px">Přidej nájem, internet, předplatné… Platba se zapíše mezi výdaje až po klepnutí na „Zaplaceno“.</div>`}</div>
  <div class="card" id="goals"><div class="row"><h2 style="margin:0">Cíle spoření</h2><button class="btn sm" id="addgoal">+ Nový cíl</button></div>
   ${S.goals.length?S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return`<div style="margin-top:16px"><div class="row"><b>${esc(g.name)}</b><small>${g.deadline?"do "+dl(g.deadline,{day:"numeric",month:"numeric",year:"numeric"}):""}</small></div><div class="bar"><i style="width:${p}%"></i></div><div class="row"><small>${fmt(g.saved)} z ${fmt(g.target)} · ${Math.round(p)} %</small><span><button class="btn sm" data-gadd="${g.id}">+ Přidat</button> <button class="btn sm gh" data-gedit="${g.id}">Upravit</button></span></div></div>`}).join(""):`<div class="empty" style="margin-top:12px">Vytvoř si cíl, třeba rezervu nebo dovolenou.</div>`}</div></div>`;
}
function statsView(){
  let bk=[],from,to=today();const mn=d=>d.toLocaleDateString("cs-CZ",{month:"short"});
  if(range==="week"){for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);bk.push({l:d.toLocaleDateString("cs-CZ",{weekday:"short"}),s:iso(d),e:iso(d)})}}
  else if(range==="month"){for(let i=-5;i<=0;i++){const p=period(i);bk.push({l:mn(P(p.s)),s:p.s,e:p.e})}}
  else{const n=new Date();for(let i=11;i>=0;i--){const a=new Date(n.getFullYear(),n.getMonth()-i,1),b=new Date(n.getFullYear(),n.getMonth()-i+1,0);bk.push({l:mn(a),s:iso(a),e:iso(b)})}}
  bk.forEach(b=>{const r=S.tx.filter(t=>inR(t,b));b.i=sum(r,"i");b.e=sum(r,"e")});
  const cur=bk[bk.length-1],prev=bk[bk.length-2],rng={s:range==="month"?cur.s:bk[0].s,e:range==="month"?cur.e:to};
  if(range==="month"){rng.s=cur.s;rng.e=cur.e}
  const rows=S.tx.filter(t=>t.type==="e"&&inR(t,rng)),tot=sum(rows,"e"),by={};rows.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...bk.map(b=>Math.max(b.i,b.e)));
  let acc=0;const arcs=ent.map(([c,v],i)=>{const p=v/tot*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i%COL.length]}" stroke-width="5.5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}"/>`;acc+=p;return s}).join("");
  const pts=bk.map((b,i)=>`${bk.length>1?i/(bk.length-1)*296+2:150},${58-b.e/mx*52}`).join(" ");
  const diff=prev&&prev.e>0?Math.round((cur.e-prev.e)/prev.e*100):null;
  const lim=+S.set.budget||0,gs=S.goals.reduce((a,g)=>a+g.target,0);
  return`<div class="top"><h1>Statistiky</h1></div><div class="stack">
  <div class="seg" id="rg" style="grid-template-columns:repeat(3,1fr)">${[["week","Týden"],["month","Období"],["year","Rok"]].map(([k,n])=>`<button class="${range===k?"on":""}" data-r="${k}">${n}</button>`).join("")}</div>
  <div class="card"><h2>Výdaje podle kategorií</h2>${ent.length?`<div class="two s" style="align-items:center"><svg viewBox="0 0 42 42" style="width:100%;max-width:190px;margin:auto" role="img" aria-label="Graf výdajů"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#8883" stroke-width="5.5"/>${arcs}<text x="21" y="20.5" text-anchor="middle" fill="currentColor" font-size="2.8" opacity=".6">celkem</text><text x="21" y="25" text-anchor="middle" fill="currentColor" font-size="3.6" font-weight="800">${Math.round(tot).toLocaleString("cs-CZ")} Kč</text></svg>
   <div class="legend">${ent.slice(0,7).map(([c,v],i)=>`<div><i style="background:${COL[i%COL.length]}"></i>${esc(c)}<em>${Math.round(v/tot*100)} %</em></div>`).join("")}</div></div>`:`<div class="empty">V tomto ${range==="week"?"týdnu":range==="month"?"období":"roce"} zatím nejsou žádné výdaje.</div>`}</div>
  <div class="card"><h2>Příjmy a výdaje</h2><div class="bars">${bk.map(b=>`<div><div class="p"><i style="height:${b.i/mx*100}%;background:#3ecf9e"></i><i style="height:${b.e/mx*100}%;background:#ee5b84"></i></div><span>${b.l}</span></div>`).join("")}</div><small>Zelená příjmy · růžová výdaje</small></div>
  <div class="card"><h2>Trend výdajů</h2><svg viewBox="0 0 300 64" style="width:100%"><polyline points="${pts}" fill="none" stroke="#ee5b84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
   ${range==="month"&&diff!==null?`<p>Oproti minulému období: <b class="${diff>0?"neg":"pos"}">${diff>0?"+":""}${diff} %</b> (${fmt(cur.e)} vs ${fmt(prev.e)})</p>`:`<small>Měsíční srovnání je v zobrazení „Období“.</small>`}</div>
  <div class="card"><h2>Nejvyšší výdaje</h2>${ent.slice(0,5).map(([c,v])=>`<div class="tx" style="cursor:default"><div class="ic">${icon(c)}</div><div class="t"><b>${esc(c)}</b></div><div class="amt">${fmt(v)}</div></div>`).join("")||`<div class="empty">Zatím žádná data.</div>`}</div>
  <div class="card"><h2>Rozpočet a spoření</h2><p>Využití limitu v období: <b>${lim?Math.round(sum(S.tx.filter(t=>inR(t,period(0))),"e")/lim*100)+" %":"limit není nastaven"}</b></p><p>Spoření: <b>${fmt(saved())}</b>${gs?` z ${fmt(gs)} (${Math.round(saved()/gs*100)} %)`:""}</p></div></div>`;
}

   <button class="btn gh" id="ejson">Stáhnout zálohu (JSON)</button><button class="btn gh" id="ijson">Obnovit ze zálohy</button><button class="btn gh" id="ecsv">Export CSV</button><button class="btn gh" id="esum">Stáhnout shrnutí období</button><button class="btn dg" id="wipe">Smazat všechna data</button></div></div>`;

const NAV=[["home","🏠","Domů"],["tx","🧾","Záznamy"],["budget","🎯","Rozpočet"],["stats","📊","Statistiky"],["set","⚙️","Nastavení"]];
function render(){
  document.documentElement.dataset.theme=S.set.theme;
  const A=$("#app");
  if(!S.set.done){A.innerHTML=onboarding();return}
  A.innerHTML=({home,tx:txView,budget:budgetView,stats:statsView,set:setView}[view])()+`<button class="btn fab" id="fab">+ Přidat</button><nav>${NAV.map(([k,i,n])=>`<button data-v="${k}" class="${view===k?"on":""}"><span>${i}</span>${n}</button>`).join("")}</nav>`;
}

/* ========= onboarding ========= */
const STEPS=[
 ["Ahoj! Jsem tvůj finanční pomocník. Jak ti mám říkat?",()=>field("o_name","Tvoje jméno","text",ob.name||"",'maxlength="30"'),()=>ob.name=$("#o_name").value.trim()],
 ["Jaký je tvůj měsíční příjem?",()=>field("o_inc","Částka v Kč","number",ob.income||"",'inputmode="decimal" min="0"'),()=>ob.income=parseFloat($("#o_inc").value)||0],
 ["Kdy ti obvykle chodí výplata?",()=>field("o_pay","Den v měsíci (1–28)","number",ob.payday||"",'inputmode="numeric" min="1" max="28"')+`<small>Podle toho spočítám tvé finanční období, např. od 15. do 14.</small>`,()=>{const v=parseInt($("#o_pay").value);ob.payday=v>=1&&v<=28?v:1}],
 ["Jaké máš pravidelné měsíční výdaje?",()=>`<label>Jedna platba na řádek: název, částka<textarea id="o_rec" rows="5" placeholder="Nájem, 12000&#10;Internet, 599">${esc(ob.rec||"")}</textarea></label><small>Budou se ti připomínat. Zapíšou se až po tvém potvrzení.</small>`,()=>ob.rec=$("#o_rec").value],
 ["Chceš si našetřit na nějaký cíl?",()=>field("o_gn","Název cíle","text",ob.gn||"",'maxlength="40" placeholder="např. Dovolená"')+field("o_gt","Cílová částka (Kč)","number",ob.gt||"",'inputmode="decimal" min="0"'),()=>{ob.gn=$("#o_gn").value.trim();ob.gt=parseFloat($("#o_gt").value)||0}],
 ["V kolik hodin ti mám každý den připomenout zapsání výdajů?",()=>field("o_rem","Čas připomenutí","time",ob.rem||"20:00")+`<small>Připomenutí můžeš kdykoli změnit v Nastavení.</small>`,()=>ob.rem=$("#o_rem").value]];
function onboarding(){
  const s=STEPS[obStep];
  return`<div class="ob"><div class="dots2">${STEPS.map((_,i)=>`<i class="${i<=obStep?"on":""}"></i>`).join("")}</div><div style="font-size:2.4rem">🌸</div><h1 style="font-size:1.8rem">${s[0]}</h1><div class="stack">${s[1]()}</div>
  <div class="two"><button class="btn gh" id="obskip">Přeskočit</button><button class="btn" id="obnext">${obStep===STEPS.length-1?"Hotovo":"Dál"}</button></div></div>`;
}
function obAdvance(skip){
  if(!skip)STEPS[obStep][2]();
  if(++obStep<STEPS.length){render();return}
  Object.assign(S.set,{name:ob.name||"",income:ob.income||0,payday:ob.payday||1,rem:ob.rem||"",remOn:false});
  const pr=period(1).s;
  (ob.rec||"").split("\n").forEach(l=>{const m=l.split(",");const a=parseFloat((m[1]||"").replace(/\s/g,"").replace(",","."));const n=(m[0]||"").trim();if(n&&a>0)S.rec.push({id:uid(),name:n.slice(0,40),amount:a,freq:"month",next:pr,cat:"Bydlení"})});
  if(ob.gn&&ob.gt>0)S.goals.push({id:uid(),name:ob.gn,target:ob.gt,saved:0,deadline:""});
  S.set.done=true;save();view="home";render();toast("Vítej! Vše můžeš později změnit v Nastavení.");
}

/* ========= formuláře: pravidelné platby, cíle, limity ========= */
function recSheet(r){
  const n=!r;r=r||{freq:"month",next:today(),cat:"Bydlení"};
  sheet(n?"Nová pravidelná platba":"Upravit platbu",field("rn","Název","text",r.name||"",'maxlength="40"')+field("ra","Částka (Kč)","number",r.amount||"",'inputmode="decimal" min="0"')+sel("rf","Frekvence",Object.entries(FREQ),r.freq)+field("rd","Další platba","date",r.next)+sel("rc","Kategorie",DEF.e.concat(S.cats.e).map(c=>[c,c]),r.cat)+(n?"":`<button class="btn dg sm" id="rdel">Smazat platbu</button>`),()=>{
    const a=num("ra"),nm=$("#rn").value.trim();if(!nm||!okAmt(a)||!$("#rd").value){toast("Vyplň název, částku a datum");return false}
    const o={id:r.id||uid(),name:nm,amount:r2(a),freq:$("#rf").value,next:$("#rd").value,cat:$("#rc").value};
    n?S.rec.push(o):S.rec[S.rec.findIndex(x=>x.id===r.id)]=o;save();render();toast("Platba uložena")},"Uložit",o=>{const d=$("#rdel",o);if(d)d.onclick=()=>{if(confirm("Smazat tuto pravidelnou platbu?")){S.rec=S.rec.filter(x=>x.id!==r.id);save();o.classList.remove("on");render()}}});
}
function goalSheet(g){
  const n=!g;g=g||{};
  sheet(n?"Nový cíl":"Upravit cíl",field("gn","Název cíle","text",g.name||"",'maxlength="40"')+field("gt","Cílová částka (Kč)","number",g.target||"",'inputmode="decimal" min="0"')+field("gs","Už našetřeno (Kč)","number",g.saved||0,'inputmode="decimal" min="0"')+field("gd","Termín (nepovinné)","date",g.deadline||"")+(n?"":`<button class="btn dg sm" id="gdel">Smazat cíl</button>`),()=>{
    const t=num("gt"),sv=num("gs")||0,nm=$("#gn").value.trim();if(!nm||!okAmt(t)||sv<0){toast("Zadej název a cílovou částku");return false}
    const o={id:g.id||uid(),name:nm,target:r2(t),saved:r2(sv),deadline:$("#gd").value};n?S.goals.push(o):S.goals[S.goals.findIndex(x=>x.id===g.id)]=o;save();render();toast("Cíl uložen")},"Uložit",o=>{const d=$("#gdel",o);if(d)d.onclick=()=>{if(confirm("Smazat cíl? Našetřená částka se vrátí do dostupného zůstatku.")){S.goals=S.goals.filter(x=>x.id!==g.id);save();o.classList.remove("on");render()}}});
}

function down(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csvCell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return`"${v.replace(/"/g,'""')}"`};
function exportCSV(){
  const h=["Datum","Typ","Kategorie","Popis","Částka (Kč)","Poznámka"];
  const l=[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==="e"?"Výdaj":"Příjem",t.cat,t.desc,String(t.amount).replace(".",","),t.notes].map(csvCell).join(";"));
  down("veronika-finance-"+today()+".csv","\ufeff"+h.map(csvCell).join(";")+"\n"+l.join("\n"),"text/csv");
}
function exportSummary(){
  const pr=period(0),r=S.tx.filter(t=>inR(t,pr)),by={};r.filter(t=>t.type==="e").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const L=[`VERONIKA FINANCE – shrnutí`,`Období: ${dl(pr.s,{day:"numeric",month:"numeric",year:"numeric"})} – ${dl(pr.e,{day:"numeric",month:"numeric",year:"numeric"})}`,``,`Příjmy: ${fmt(sum(r,"i"))}`,`Výdaje: ${fmt(sum(r,"e"))}`,`Zbývá: ${fmt(sum(r,"i")-sum(r,"e"))}`,`Limit výdajů: ${S.set.budget?fmt(S.set.budget):"nenastaven"}`,`Našetřeno: ${fmt(saved())}`,`Dostupný zůstatek: ${fmt(balance())}`,``,`Výdaje podle kategorií:`,...Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>` - ${c}: ${fmt(v)}`)];
  down("shrnuti-"+today()+".txt",L.join("\n"),"text/plain");
}
function importJSON(f){
  const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(!d||!Array.isArray(d.tx)||!d.set)throw 0;
    d.tx=d.tx.filter(t=>t&&t.amount>0&&/^\d{4}-\d\d-\d\d$/.test(t.date)&&(t.type==="e"||t.type==="i")).map(t=>({id:String(t.id||uid()),type:t.type,amount:+t.amount,cat:String(t.cat||"Ostatní"),desc:String(t.desc||""),notes:String(t.notes||""),date:t.date}));
    if(!confirm(`Záloha obsahuje ${d.tx.length} záznamů. Nahradit všechna současná data?`))return;
    S=Object.assign(fresh(),d);S.set=Object.assign(fresh().set,d.set,{done:true});S.cats=Object.assign({e:[],i:[]},d.cats);S.limits=d.limits||{};["goals","rec"].forEach(k=>S[k]=Array.isArray(d[k])?d[k]:[]);
    save();render();toast("Data obnovena ze zálohy")}catch(e){toast("Tento soubor není platná záloha")}};rd.readAsText(f);
}

/* ========= připomenutí ========= */
function checkRem(){
  const s=S&&S.set;if(!s||!s.remOn||!s.rem)return;const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  if(hm>=s.rem&&s.lastRem!==today()&&hm<=addMin(s.rem,120)){s.lastRem=today();save();
    const msg="Nezapomněla jsi zapsat dnešní výdaje?";toast(msg);
    if("Notification" in window&&Notification.permission==="granted"){navigator.serviceWorker&&navigator.serviceWorker.ready?navigator.serviceWorker.ready.then(r=>r.showNotification("Veronika Finance",{body:msg,icon:"icon.svg"})).catch(()=>new Notification("Veronika Finance",{body:msg})):new Notification("Veronika Finance",{body:msg})}}
}
const addMin=(t,m)=>{const [h,mi]=t.split(":").map(Number),x=Math.min(h*60+mi+m,1439);return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};

/* ========= události ========= */
document.addEventListener("click",e=>{
  const t=e.target,c=s=>t.closest(s);let b;
  if(c("#fab"))return txSheet();
  if(b=c("[data-v]")){view=b.dataset.v;scrollTo(0,0);return render()}
  if(b=c("[data-go]")){view=b.dataset.go==="rec"?"budget":b.dataset.go;scrollTo(0,0);return render()}
  if(b=c("[data-edit]"))return txSheet(S.tx.find(x=>x.id===b.dataset.edit));
  if(b=c("[data-po]")){pOff+=+b.dataset.po;if(pOff>1)pOff=1;return render()}
  if(b=c("[data-day]")){selDay=b.dataset.day;return render()}
  if(b=c("[data-r]")){range=b.dataset.r;return render()}
  if(b=c("[data-rpay]")){const r=S.rec.find(x=>x.id===b.dataset.rpay);S.tx.push({id:uid(),type:"e",amount:r.amount,cat:r.cat,desc:r.name,notes:"Pravidelná platba",date:r.next<=today()?r.next:today()});r.next=advance(r.next,r.freq);save();render();return toast("Platba zapsána mezi výdaje")}
  if(b=c("[data-rskip]")){const r=S.rec.find(x=>x.id===b.dataset.rskip);r.next=advance(r.next,r.freq);save();render();return toast("Platba přeskočena")}
  if(b=c("[data-redit]"))return recSheet(S.rec.find(x=>x.id===b.dataset.redit));
  if(b=c("[data-gedit]"))return goalSheet(S.goals.find(x=>x.id===b.dataset.gedit));
  if(b=c("[data-gadd]")){const g=S.goals.find(x=>x.id===b.dataset.gadd);
    return sheet("Přidat do cíle: "+g.name,field("ga","Částka (Kč)","number","",'inputmode="decimal" min="0"')+`<small>Dostupný zůstatek: ${fmt(balance())}. Peníze se odečtou ze zůstatku.</small>`,()=>{const a=num("ga");if(!okAmt(a)){toast("Zadej částku větší než 0");return false}
      if(a>balance()&&!confirm("Částka je vyšší než tvůj dostupný zůstatek. Přesto přidat?"))return false;g.saved=r2(g.saved+a);save();render();toast(g.saved>=g.target?"Cíl splněn! 🎉":"Přidáno do cíle")})}
  if(b=c("[data-dc]")){const [ty,n]=b.dataset.dc.split("|");if(S.tx.some(x=>x.type===ty&&x.cat===n)){return toast("Kategorie se používá u záznamů, nelze ji smazat")}S.cats[ty]=S.cats[ty].filter(x=>x!==n);save();return render()}
  if(c("#addrec"))return recSheet();
  if(c("#addgoal"))return goalSheet();
  if(c("#setlim"))return sheet("Limit výdajů za období",field("bl","Limit (Kč), 0 = bez limitu","number",S.set.budget||"",'inputmode="decimal" min="0"'),()=>{const v=num("bl");if(!(v>=0)){toast("Zadej platnou částku");return false}S.set.budget=v||0;save();render()});
  if(c("#catlim"))return sheet("Limit kategorie",sel("lc","Kategorie",DEF.e.concat(S.cats.e).map(x=>[x,x]),DEF.e[0])+field("lv","Limit za období (Kč), 0 = zrušit","number","",'inputmode="decimal" min="0"'),()=>{const v=num("lv");if(!(v>=0)){toast("Zadej platnou částku");return false}const k=$("#lc").value;v>0?S.limits[k]=v:delete S.limits[k];save();render()});
  if(c("#ssave")){const p=parseInt($("#sp").value);if(!(p>=1&&p<=28))return toast("Den výplaty musí být 1–28");
    Object.assign(S.set,{name:$("#sn").value.trim(),payday:p,budget:parseFloat($("#sb").value)||0,income:parseFloat($("#si").value)||0,theme:$("#st").value,rem:$("#sr").value});pOff=0;save();render();return toast("Nastavení uloženo")}
  if(c("#remon")){S.set.rem=$("#sr").value||"20:00";
    if(S.set.remOn){S.set.remOn=false;save();render();return toast("Připomenutí vypnuto")}
    if(!("Notification" in window)){S.set.remOn=true;save();render();return toast("Oznámení tvůj prohlížeč nepodporuje, ukážu jen zprávu v aplikaci")}
    return Notification.requestPermission().then(p=>{S.set.remOn=true;save();render();toast(p==="granted"?"Připomenutí zapnuto":"Oznámení nejsou povolena, připomenu jen v otevřené aplikaci")})}
  if(c("#ejson"))return down("veronika-finance-zaloha-"+today()+".json",JSON.stringify(S,null,1),"application/json");
  if(c("#ijson"))return $("#file").click();
  if(c("#ecsv")||c("#csv"))return exportCSV();
  if(c("#esum"))return exportSummary();
  if(c("#fclr")){flt={q:"",type:"",cat:"",month:""};return render()}
  if(c("#wipe")){if(!confirm("Opravdu smazat VŠECHNA data? Nejdřív si můžeš stáhnout zálohu."))return;if(prompt("Pro potvrzení napiš SMAZAT")!=="SMAZAT")return toast("Smazání zrušeno");S=fresh();S.set.done=true;obStep=0;save();view="home";render();return toast("Všechna data byla smazána")}
  if(c("#obnext"))return obAdvance(false);
  if(c("#obskip"))return obAdvance(true);
});
document.addEventListener("input",e=>{if(e.target.id==="fq"){flt.q=e.target.value;const p=e.target.selectionStart;render();const f=$("#fq");f.focus();f.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{const m={ft:"type",fcat:"cat",fm:"month"}[e.target.id];if(m){flt[m]=e.target.value;render()}});
$("#file").onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=""};

/* ========= start ========= */
(async()=>{
  S=await load();
  if(S){S=Object.assign(fresh(),S);S.set=Object.assign(fresh().set,S.set);S.cats=Object.assign({e:[],i:[]},S.cats)}
  else{S=fresh();migrate();if(S.tx.length)S.set.done=true}
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  setInterval(checkRem,20000);checkRem();
})();
</script>
</body>
